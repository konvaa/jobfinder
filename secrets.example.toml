[email]
# Heslo k odchozí poště (SMTP) účtu z config.toml → [email] uzivatel.
#
# Heslo je tu uložené čitelně. Proto sem NEDÁVEJ hlavní heslo k účtu:
#   - Seznam: zapni dvoufázové ověření a vytvoř HESLO PRO APLIKACE
#     (Účet Seznam → Zabezpečení účtu → Dvoufázové ověření → Heslo pro
#     aplikace). Platí jen pro poštovní programy a dá se kdykoli zrušit,
#     aniž bys měnil hlavní heslo.
#   - Gmail: HESLO APLIKACE je povinné (Účet Google → Zabezpečení →
#     Hesla aplikací).
#   - Nejbezpečnější: zvláštní schránka jen na odesílání souhrnů. Kdyby heslo
#     uniklo, nikdo se nedostane k tvé osobní poště.
heslo = ""

[ai]
# API klíč pro Claude (console.anthropic.com). Nepovinné – bez něj se
